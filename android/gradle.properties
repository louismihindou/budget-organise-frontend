# Limiter la mémoire pour éviter le crash JVM
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process

# AndroidX et Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Optionnel pour build plus stable
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
